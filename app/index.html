<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Surplus">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131315" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Surplus Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://storage.ghost.io">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf8f3; --card:#ffffff; --ink:#18181b; --ink2:#52525b; --ink3:#8a8a93;
  --line:#e7e4dc; --accent:#c8372d; --accent-soft:#f6e3e0; --ok:#2f7d4f; --ok-soft:#e3f1e8;
  --bar:rgba(250,248,243,.92); --ph:#ebe7de;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#131315;--card:#1c1c1f;--ink:#f2f1ee;--ink2:#b6b5b0;--ink3:#85848a;--line:#2c2c30;
    --accent:#ef5b4f;--accent-soft:#3a1f1d;--ok:#5cc489;--ok-soft:#1b3326;--bar:rgba(19,19,21,.92);--ph:#26262a}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
svg{display:block}
img{display:block}

header.top{position:sticky;top:0;z-index:20;background:var(--bar);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);padding-top:var(--st);padding-left:var(--sl);padding-right:var(--sr)}
.bar{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 8px;max-width:760px;margin:0 auto}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.iconbtn:active{background:var(--line)}
.brand{font-family:var(--serif);font-weight:700;font-size:23px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:6px}
.brand i{font-style:normal;font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;max-width:760px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:500;color:var(--ink2);border:1px solid var(--line);background:var(--card);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

main{max-width:760px;margin:0 auto;padding:6px 16px calc(96px + var(--sb));padding-left:calc(16px + var(--sl));padding-right:calc(16px + var(--sr))}
.notice{margin:14px 0;padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:14px}
.notice.soft{background:var(--card);border:1px solid var(--line);color:var(--ink2)}

.h-sec{display:flex;align-items:baseline;justify-content:space-between;margin:30px 0 4px;padding-top:12px;border-top:3px solid var(--ink)}
.h-sec h2{margin:0;font-family:var(--serif);font-size:21px;font-weight:700}
.h-sec button{font-size:14px;font-weight:600;color:var(--accent)}
.pagetitle{font-family:var(--serif);font-size:30px;font-weight:700;margin:18px 0 2px;letter-spacing:-.01em}
.pagesub{color:var(--ink2);font-size:14px;margin:0 0 6px}

/* Karten */
.card{padding:14px 0;border-bottom:1px solid var(--line)}
.card:last-child{border-bottom:0}
.card .row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.thumb{width:108px;height:81px;border-radius:8px;object-fit:cover;background:var(--ph)}
.kicker{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.kicker .tag{color:var(--ink3);font-weight:600}
.title{font-family:var(--serif);font-weight:700;font-size:19px;line-height:1.22;letter-spacing:-.005em;display:block}
.teaser{color:var(--ink2);font-size:15px;margin-top:5px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:13px;color:var(--ink3);min-width:0}
.badge{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:12px;padding:2px 8px;border-radius:999px}
.badge.read{background:var(--ok-soft);color:var(--ok)}
.badge.new{background:var(--accent-soft);color:var(--accent)}
.card.isread .title{color:var(--ink2)}
.card.isread .thumb,.hero.isread .heroimg{opacity:.6}
.actions{display:flex;gap:2px;flex:none;margin-right:-8px}
.act{width:40px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--ink3)}
.act:active{background:var(--line)}
.act.on.save{color:var(--accent)}
.act.on.done{color:var(--ok)}

.why{margin-top:7px;padding:8px 10px;border-radius:10px;background:var(--accent-soft);font-size:14px;line-height:1.4;color:var(--ink)}
.why b{color:var(--accent);font-weight:700}
.picks{margin:16px 0 6px;padding:14px 14px 4px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.picks .ph{display:flex;align-items:baseline;justify-content:space-between}
.picks h2{margin:0;font-family:var(--serif);font-size:22px}
.picks .ph span{font-size:13px;color:var(--ink3)}
.picks .card:last-child{border-bottom:0}
.hero{padding:16px 0 14px;border-bottom:1px solid var(--line)}
.heroimg{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:var(--ph);margin-bottom:12px}
.hero .title{font-size:28px;line-height:1.12}
.hero .teaser{font-size:17px}

.issue{margin:20px 0 6px;padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.issue .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.issue .nm{font-family:var(--serif);font-size:22px;font-weight:700;margin:2px 0 10px}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog>div{height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.issue .r{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:14px;color:var(--ink2)}

.toggle{display:flex;gap:8px;margin:10px 0 2px;flex-wrap:wrap}
.seg{padding:7px 13px;border-radius:999px;font-size:14px;font-weight:500;border:1px solid var(--line);color:var(--ink2);background:var(--card)}
.seg.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.more{display:block;width:100%;margin:16px 0;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
.empty{padding:36px 8px;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink2);font-size:17px;margin-bottom:4px}
.day{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:22px 0 0}
.colhead{font-family:var(--serif);font-size:20px;font-weight:700;margin:26px 0 0;padding-top:10px;border-top:1px solid var(--ink)}
.colhead small{display:block;font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink3)}

.search{display:flex;align-items:center;gap:8px;margin:14px 0 4px;padding:0 12px;height:46px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.search input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:17px;color:var(--ink)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-top:1px solid var(--line);padding-bottom:var(--sb);padding-left:var(--sl);padding-right:var(--sr)}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);max-width:760px;margin:0 auto}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:11px;font-weight:600;color:var(--ink3);position:relative}
.tab.on{color:var(--ink)}
.tab .cnt{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;display:grid;place-items:center}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(84vw,340px);z-index:41;background:var(--bg);transform:translateX(-102%);transition:transform .25s ease;
  padding:calc(12px + var(--st)) 0 calc(20px + var(--sb)) var(--sl);overflow-y:auto;border-right:1px solid var(--line)}
body.menu .scrim{opacity:1;pointer-events:auto}
body.menu .drawer{transform:none}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:0 8px 8px 20px}
.drawer h3{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:20px 20px 4px}
.mi{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:11px 20px;font-size:17px;font-weight:500}
.mi:active{background:var(--line)}
.mi.on{color:var(--accent);font-weight:700}
.mi span.n{font-size:13px;color:var(--ink3);font-weight:500}
.drawer .info{margin:22px 20px 0;font-size:13px;color:var(--ink3)}
.drawer .info a{color:var(--accent);font-weight:600}

.sheet textarea{width:100%;min-height:120px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:13px ui-monospace,Menlo,monospace;padding:10px}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--sb));transform:translateX(-50%) translateY(20px);opacity:0;transition:.2s;z-index:50;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.skel{height:14px;border-radius:6px;background:var(--line);margin:10px 0;animation:p 1.2s infinite ease-in-out}
@keyframes p{50%{opacity:.5}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <button class="iconbtn" id="btnMenu" aria-label="Menü">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button class="brand" id="btnHome">Surplus <i>Reader</i></button>
    <button class="iconbtn" id="btnSearch" aria-label="Suche">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main id="main"><div class="skel" style="width:100%;height:190px;margin-top:18px;border-radius:12px"></div><div class="skel" style="width:40%"></div><div class="skel" style="width:90%;height:28px"></div><div class="skel"></div></main>

<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Menü"></aside>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
const BASE = "https://www.surplusmagazin.de/";
const STORE_KEY = "surplus-reader-state-v1";
const SECTIONS = [["politik","Politik"],["wirtschaft","Wirtschaft"],["finanzen","Finanzen"],["klima","Klima"],["international","Internationales"],["wissenschaft","Wissenschaft"]];
const SECLABEL = Object.fromEntries(SECTIONS);
const VIEWS = {start:"Start",fuerdich:"Für dich",neu:"Neueste",empfehlungen:"Empfehlungen",kolumnen:"Kolumnen",video:"Video & Podcast",heft:"Heft",
  merkliste:"Merkliste",verlauf:"Verlauf",suche:"Suche",sicherung:"Sicherung",...SECLABEL};
const CHIPS = ["start","fuerdich","neu",...SECTIONS.map(s=>s[0]),"kolumnen","video","heft","empfehlungen"];
const PAGE = 30;

const ICON = {
  save:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3.5h12a.5.5 0 0 1 .5.5v16.6a.3.3 0 0 1-.48.24L12 16.5l-6.02 4.34a.3.3 0 0 1-.48-.24V4a.5.5 0 0 1 .5-.5Z"/></svg>',
  saveOn:'<svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3.5h12a.5.5 0 0 1 .5.5v16.6a.3.3 0 0 1-.48.24L12 16.5l-6.02 4.34a.3.3 0 0 1-.48-.24V4a.5.5 0 0 1 .5-.5Z"/></svg>',
  done:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.7 2.7L16 9.8"/></svg>',
  doneOn:'<svg width="21" height="21" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="m7.8 12.5 2.9 2.9 5.6-5.8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  home:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20h-5.5v-6h-5v6H4z"/></svg>',
  list:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>',
  hist:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3.5 4.5V9H8"/><path d="M12 8v4.5l3 2"/></svg>',
  close:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>'
};

// ---------- Zustand ----------
let articles = [], byId = new Map(), issueNames = {}, updated = "", picks = [];
let mine = loadState();
let loaded = false, loadError = false, onlyUnread = false, query = "", shown = PAGE, lastLoad = 0;

function loadState(){ try{ const s = JSON.parse(localStorage.getItem(STORE_KEY)||"{}"); return (s && typeof s==="object") ? s : {}; }catch(_){ return {}; } }
function saveState(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(mine)); }catch(_){ toast("Speichern nicht möglich"); } }

const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function view(){ const h=(location.hash||"").slice(1); return VIEWS[h]?h:"start"; }
function go(v){ shown = PAGE; if(location.hash.slice(1)!==v) location.hash=v; else { render(); window.scrollTo(0,0); } closeMenu(); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1600); }

// ---------- Daten ----------
async function loadData(){
  try{
    const r = await fetch("data/articles.json?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    articles = (j.articles||[]).filter(a=>a.t&&a.u);
    byId = new Map(articles.map(a=>[a.id,a]));
    issueNames = j.issues||{}; updated = j.updated||"";
    loaded = true; loadError = false; lastLoad = Date.now();
  }catch(e){ loadError = !articles.length; loaded = !!articles.length; }
  try{
    const r2 = await fetch("data/picks.json?t="+Date.now(), {cache:"no-store"});
    if(r2.ok){ const p = await r2.json(); picks = (p.days||[]).filter(d=>d&&d.date&&Array.isArray(d.picks)).sort((a,b)=>a.date<b.date?1:-1); }
  }catch(_){}
  render();
}
function sortNew(list){ return list.slice().sort((x,y)=>{ const dx=x.d||"", dy=y.d||""; return dx===dy?0:(dx<dy?1:-1); }); }
const st = id => mine[id]||{};
const isRead = id => !!st(id).read;
const isSaved = id => !!st(id).saved;
const urlOf = a => /^https?:/.test(a.u) ? a.u : BASE + a.u.replace(/^\//,"");
function img(a, w){
  if(!a.i) return "";
  if(/\/content\/images\/(?!size\/)/.test(a.i) && !/\.(gif|svg)(\?|$)/i.test(a.i)) return a.i.replace("/content/images/","/content/images/size/w"+w+"/");
  return a.i;
}
function asDate(d){ if(!d) return null; const x=new Date(d.length<=10?d+"T12:00:00":d); return isNaN(x)?null:x; }
function fmtDate(d){
  const dt=asDate(d); if(!dt) return "";
  const today=new Date(); today.setHours(0,0,0,0); const day=new Date(dt); day.setHours(0,0,0,0);
  const diff=Math.round((today-day)/864e5);
  if(diff===0) return "Heute, "+dt.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
  if(diff===1) return "Gestern";
  return dt.toLocaleDateString("de-DE",{day:"numeric",month:"short",year:dt.getFullYear()!==today.getFullYear()?"numeric":undefined});
}
function dayLabel(ts){
  const dt=new Date(ts); const today=new Date(); today.setHours(0,0,0,0); const day=new Date(dt); day.setHours(0,0,0,0);
  const diff=Math.round((today-day)/864e5);
  if(diff===0) return "Heute"; if(diff===1) return "Gestern"; if(diff<7) return dt.toLocaleDateString("de-DE",{weekday:"long"});
  return dt.toLocaleDateString("de-DE",{day:"numeric",month:"long",year:"numeric"});
}
function isFresh(a){ const d=asDate(a.d); return d && Date.now()-d.getTime() < 36*36e5; }
function kicker(a){
  if(a.c) return esc(a.c);
  if(a.k==="podcast") return "Video &amp; Podcast";
  if(a.k==="wochenbrief") return "Wochenbrief";
  if(a.s&&a.s.length) return esc(SECLABEL[a.s[0]]||"");
  if(a.k==="news") return "News";
  if(a.g&&a.g.length) return esc(a.g[0]);
  return "Surplus";
}

// ---------- Darstellung ----------
function actions(a){
  const r=isRead(a.id), s=isSaved(a.id);
  return `<div class="actions">
    <button class="act save ${s?"on":""}" data-save="${esc(a.id)}" aria-label="${s?"Von Merkliste entfernen":"Merken"}">${s?ICON.saveOn:ICON.save}</button>
    <button class="act done ${r?"on":""}" data-done="${esc(a.id)}" aria-label="${r?"Als ungelesen markieren":"Als gelesen markieren"}">${r?ICON.doneOn:ICON.done}</button>
  </div>`;
}
function metaLine(a, opts){
  const meta=[a.a?esc(a.a):"", fmtDate(a.d)].filter(Boolean).join(" · ");
  const badge = isRead(a.id) ? '<span class="badge read">✓ Gelesen</span>' : (opts.markNew&&isFresh(a)?'<span class="badge new">Neu</span>':"");
  return `<div class="meta">${meta?`<span>${meta}</span>`:""}${badge}</div>`;
}
function head(a){ const tags=[]; if(a.h) tags.push("Heft #"+esc(a.h)); return `<div class="kicker">${kicker(a)}${tags.length?` <span class="tag">· ${tags.join(" · ")}</span>`:""}</div>`; }
function card(a, opts={}){
  const href=esc(urlOf(a)), id=esc(a.id), r=isRead(a.id);
  if(opts.hero){
    return `<article class="hero ${r?"isread":""}">
      <a href="${href}" target="_blank" rel="noopener" data-open="${id}">
        ${a.i?`<img class="heroimg" src="${esc(img(a,1000))}" alt="" loading="eager" decoding="async" data-orig="${esc(a.i)}">`:""}
        ${head(a)}<span class="title">${esc(a.t)}</span>
        ${a.x?`<div class="teaser">${esc(a.x)}</div>`:""}
      </a>
      <div class="foot">${metaLine(a,opts)}${actions(a)}</div>
    </article>`;
  }
  const showTeaser = opts.teaser!==false && a.x;
  return `<article class="card ${r?"isread":""}">
    <a class="row" href="${href}" target="_blank" rel="noopener" data-open="${id}">
      <div>${head(a)}<span class="title">${esc(a.t)}</span>${showTeaser?`<div class="teaser">${esc(a.x)}</div>`:""}${opts.why?`<div class="why"><b>Warum für dich:</b> ${esc(opts.why)}</div>`:""}</div>
      ${a.i?`<img class="thumb" src="${esc(img(a,300))}" alt="" loading="lazy" decoding="async" data-orig="${esc(a.i)}">`:""}
    </a>
    <div class="foot">${metaLine(a,opts)}${actions(a)}</div>
  </article>`;
}
const list = (items,opts)=>items.map(a=>card(a,opts)).join("");
const empty = (t,s)=>`<div class="empty"><b>${t}</b>${s||""}</div>`;
const unread = items => onlyUnread ? items.filter(a=>!isRead(a.id)) : items;
const toggleRow = () => `<div class="toggle"><button class="seg ${!onlyUnread?"on":""}" data-filter="0">Alle</button><button class="seg ${onlyUnread?"on":""}" data-filter="1">Nur ungelesene</button></div>`;
function paged(items, opts){
  const part = items.slice(0, shown);
  return list(part, opts) + (items.length>shown ? `<button class="more" data-more="1">Weitere Artikel laden (${items.length-shown})</button>` : "");
}

function issues(){
  const m=new Map(); articles.forEach(a=>{ if(a.h){ const k=String(a.h); if(!m.has(k)) m.set(k,[]); m.get(k).push(a);} });
  return [...m.entries()].sort((a,b)=>Number(b[0])-Number(a[0]));
}
function issueName(n){ const s=issueNames[n]||""; return s.replace(/^\s*Surplus[\s-]*(Ausgabe|Magazin)?\s*#?\s*\d+\s*[–:\-]?\s*/i,"").replace(/^[»"„]|[«"“]$/g,"").trim(); }
function issueCard(num, items, compact){
  const done=items.filter(a=>isRead(a.id)).length, pct=items.length?Math.round(done/items.length*100):0;
  return `<div class="issue">
    <div class="lbl">${compact?"Aktuelles Heft · ":""}Ausgabe #${esc(num)}</div>
    <div class="nm">${esc(issueName(num))}</div>
    <div class="prog"><div style="width:${pct}%"></div></div>
    <div class="r"><span>${done} von ${items.length} Artikeln gelesen</span>${compact?`<button class="seg" data-go="heft">Zum Heft</button>`:""}</div>
  </div>`;
}

function todayKey(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function pickCards(day){ return day.picks.map(p=>{ const a=byId.get(p.id); return a?card(a,{teaser:false,why:p.why}):""; }).join(""); }
function dayTitle(k){ if(k===todayKey()) return "Heute"; const d=new Date(k+"T12:00:00"); const y=new Date(); y.setDate(y.getDate()-1); if(d.toDateString()===y.toDateString()) return "Gestern"; return d.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"}); }
function picksBlock(){
  const day=picks[0]; if(!day) return "";
  const age=(new Date(todayKey()+"T12:00:00")-new Date(day.date+"T12:00:00"))/864e5; if(age>2) return "";
  const done=day.picks.filter(p=>isRead(p.id)).length;
  return `<section class="picks"><div class="ph"><h2>Für dich ${day.date===todayKey()?"heute":"– "+esc(dayTitle(day.date))}</h2><span>${done}/${day.picks.length} gelesen</span></div>${day.note?`<p class="pagesub" style="margin:4px 0 0">${esc(day.note)}</p>`:""}${pickCards(day)}<button class="more" style="margin:6px 0 12px" data-go="fuerdich">Frühere Empfehlungen</button></section>`;
}
function renderFuerDich(){
  let h=`<h1 class="pagetitle">Für dich</h1><p class="pagesub">Jeden Morgen drei Artikel, von Claude passend zu deinem Interessenprofil ausgesucht.</p>`;
  if(!picks.length) return h+empty("Noch keine Empfehlungen","Die ersten Vorschläge erscheinen am nächsten Morgen.");
  for(const day of picks.slice(0,30)){ const c=pickCards(day); if(c) h+=`<div class="day">${esc(dayTitle(day.date))}</div>${day.note?`<p class="pagesub" style="margin:2px 0 0">${esc(day.note)}</p>`:""}`+c; }
  return h;
}
function renderStart(){
  const items=sortNew(articles);
  if(!items.length) return empty("Noch keine Artikel","Die Artikelliste wird gerade erstellt – schau in ein paar Minuten wieder rein.");
  const top=items.slice(0,40);
  const hero=top.find(a=>!isRead(a.id)&&a.i) || items[0];
  const rest=items.filter(a=>a.id!==hero.id).slice(0,7);
  let h=picksBlock() + card(hero,{hero:true,markNew:true}) + list(rest,{markNew:true,teaser:false});
  h+=`<button class="more" data-go="neu">Alle neuen Artikel</button>`;
  const saved=articles.filter(a=>isSaved(a.id)&&!isRead(a.id)).sort((x,y)=>(st(y.id).savedAt||0)-(st(x.id).savedAt||0));
  if(saved.length) h+=`<div class="h-sec"><h2>Auf deiner Merkliste</h2><button data-go="merkliste">Alle ${saved.length}</button></div>`+list(saved.slice(0,3),{teaser:false});
  const iss=issues()[0]; if(iss) h+=issueCard(iss[0],iss[1],true);
  const picks=items.filter(a=>a.r).slice(0,3);
  if(picks.length) h+=`<div class="h-sec"><h2>Auswahl der Redaktion</h2><button data-go="empfehlungen">Mehr</button></div>`+list(picks,{teaser:false});
  for(const [k,label] of SECTIONS){
    const sec=items.filter(a=>(a.s||[]).includes(k)).slice(0,3);
    if(sec.length) h+=`<div class="h-sec"><h2>${label}</h2><button data-go="${k}">Mehr</button></div>`+list(sec,{teaser:false});
  }
  const cols=items.filter(a=>a.c).slice(0,3);
  if(cols.length) h+=`<div class="h-sec"><h2>Kolumnen</h2><button data-go="kolumnen">Mehr</button></div>`+list(cols,{teaser:false});
  const vids=items.filter(a=>a.k==="podcast").slice(0,2);
  if(vids.length) h+=`<div class="h-sec"><h2>Video &amp; Podcast</h2><button data-go="video">Mehr</button></div>`+list(vids,{teaser:false});
  return h;
}
function renderListView(title, sub, items){
  items=unread(sortNew(items));
  return `<h1 class="pagetitle">${title}</h1>${sub?`<p class="pagesub">${sub}</p>`:""}${toggleRow()}`+
    (items.length?paged(items,{markNew:true}):empty(onlyUnread?"Alles gelesen":"Keine Artikel", onlyUnread?"In diesem Bereich hast du alles gelesen.":""));
}
function renderKolumnen(){
  const items=unread(sortNew(articles.filter(a=>a.c)));
  const groups=new Map(); items.forEach(a=>{ if(!groups.has(a.c)) groups.set(a.c,[]); groups.get(a.c).push(a); });
  let h=`<h1 class="pagetitle">Kolumnen</h1><p class="pagesub">Piketty, Mazzucato, Truger und weitere – die regelmäßigen Meinungsbeiträge.</p>${toggleRow()}`;
  if(!groups.size) return h+empty(onlyUnread?"Alles gelesen":"Keine Kolumnen");
  for(const [c,l] of groups){ h+=`<div class="colhead">${esc(c)}<small>${esc(l[0].a||"")} · ${l.length} Beiträge</small></div>`+list(l.slice(0,5),{teaser:false}); }
  return h;
}
function renderHeft(){
  const iss=issues();
  if(!iss.length) return `<h1 class="pagetitle">Das Heft</h1>`+empty("Noch keine Heftartikel");
  let h=`<h1 class="pagetitle">Das Heft</h1><p class="pagesub">Alle Artikel der Printausgaben auch online. Hake ab, was du gelesen hast – egal ob im Heft oder in der App.</p>`;
  const [num,items]=iss[0];
  h+=issueCard(num,items,false)+list(sortNew(items).sort((x,y)=>Number(isRead(x.id))-Number(isRead(y.id))),{teaser:true});
  if(iss.length>1){
    h+=`<div class="h-sec"><h2>Frühere Ausgaben</h2></div>`;
    for(const [n,its] of iss.slice(1)){ const d=its.filter(a=>isRead(a.id)).length;
      h+=`<button class="mi" style="padding-left:0;padding-right:0" data-issue="${esc(n)}">#${esc(n)} ${esc(issueName(n))}<span class="n">${d}/${its.length} gelesen</span></button>`; }
  }
  return h;
}
function renderIssue(n){
  const its=articles.filter(a=>String(a.h)===String(n));
  return `<h1 class="pagetitle">Ausgabe #${esc(n)}</h1>`+issueCard(n,its,false)+list(sortNew(its),{teaser:true})+`<button class="more" data-go="heft">Zurück zum aktuellen Heft</button>`;
}
function renderMerkliste(){
  const items=articles.filter(a=>isSaved(a.id)).sort((x,y)=>(st(y.id).savedAt||0)-(st(x.id).savedAt||0));
  const open=items.filter(a=>!isRead(a.id)), done=items.filter(a=>isRead(a.id));
  let h=`<h1 class="pagetitle">Merkliste</h1><p class="pagesub">${open.length} Artikel noch zu lesen</p>`;
  if(!items.length) return h+empty("Deine Merkliste ist leer","Tippe bei einem Artikel auf das Lesezeichen, um ihn für später zu merken.");
  h+=open.length?list(open):empty("Alles gelesen 🎉","");
  if(done.length) h+=`<div class="h-sec"><h2>Schon gelesen</h2><button data-clear="1">Entfernen</button></div>`+list(done,{teaser:false});
  return h;
}
function renderVerlauf(){
  const items=articles.map(a=>({a,ts:st(a.id).openedAt||(st(a.id).read?st(a.id).readAt:0)})).filter(x=>x.ts).sort((x,y)=>y.ts-x.ts);
  let h=`<h1 class="pagetitle">Verlauf</h1><p class="pagesub">Zuletzt geöffnete und als gelesen markierte Artikel.</p>`;
  if(!items.length) return h+empty("Noch kein Verlauf","Sobald du Artikel öffnest, erscheinen sie hier.");
  let last="";
  for(const {a,ts} of items.slice(0,shown)){ const d=dayLabel(ts); if(d!==last){ h+=`<div class="day">${d}</div>`; last=d; } h+=card(a,{teaser:false}); }
  if(items.length>shown) h+=`<button class="more" data-more="1">Mehr anzeigen</button>`;
  return h;
}
function renderSuche(){
  const q=query.trim().toLowerCase();
  let h=`<div class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--ink3)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Titel, Autor oder Thema" value="${esc(query)}" autocomplete="off" enterkeyhint="search"></div>`;
  if(!q) return h+`<p class="pagesub" style="margin-top:10px">Durchsucht alle ${articles.length} Artikel.</p>`;
  const words=q.split(/\s+/);
  const hits=sortNew(articles.filter(a=>{ const hay=[a.t,a.a,a.x,a.c,(a.s||[]).map(s=>SECLABEL[s]).join(" "),(a.g||[]).join(" ")].join(" ").toLowerCase(); return words.every(w=>hay.includes(w)); }));
  return h+`<p class="pagesub" style="margin-top:10px">${hits.length} Treffer</p>`+(hits.length?paged(hits,{teaser:false}):"");
}
function renderSicherung(){
  const n=Object.keys(mine).length;
  return `<h1 class="pagetitle">Sicherung</h1>
  <p class="pagesub">Merkliste und Verlauf liegen nur auf diesem Gerät (${n} Einträge). Kopiere die Sicherung z. B. in eine Notiz – und füge sie bei Bedarf hier wieder ein.</p>
  <div class="sheet">
    <button class="more" data-backup="copy">Sicherung kopieren</button>
    <textarea id="bk" placeholder="Sicherung hier einfügen …"></textarea>
    <button class="more" data-backup="restore">Sicherung einspielen</button>
  </div>`;
}

function renderChips(v){
  const hide = ["merkliste","verlauf","suche","sicherung"].includes(v) || v.startsWith("ausgabe");
  $("#chips").style.display = hide?"none":"";
  $("#chips").innerHTML = CHIPS.map(k=>`<button class="chip ${k===v?"on":""}" data-go="${k}">${VIEWS[k]}</button>`).join("");
  const on=$("#chips .chip.on"), c=$("#chips"); if(on) c.scrollLeft = on.offsetLeft - c.clientWidth/2 + on.clientWidth/2;
}
function openCount(){ return articles.filter(a=>isSaved(a.id)&&!isRead(a.id)).length; }
function renderTabs(v){
  const n=openCount();
  const t=[["start","Start",ICON.home],["neu","Neueste",ICON.list],["merkliste","Merkliste",ICON.save],["verlauf","Verlauf",ICON.hist]];
  $("#tabs").innerHTML=t.map(([k,l,ic])=>`<button class="tab ${k===v?"on":""}" data-go="${k}">${ic}<span>${l}</span>${k==="merkliste"&&n?`<span class="cnt">${n}</span>`:""}</button>`).join("");
}
function renderDrawer(v){
  const cnt=k=>articles.filter(a=>(a.s||[]).includes(k)&&!isRead(a.id)).length;
  const n=openCount();
  const mi=(k,l,x)=>`<button class="mi ${k===v?"on":""}" data-go="${k}">${l}${x?`<span class="n">${x}</span>`:""}</button>`;
  const upd = updated ? new Date(updated.replace(/Z?$/,"Z")).toLocaleString("de-DE",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "";
  $("#drawer").innerHTML=`
    <div class="dh"><span class="brand">Surplus <i>Reader</i></span><button class="iconbtn" data-close="1" aria-label="Schließen">${ICON.close}</button></div>
    <h3>Meine Artikel</h3>
    ${mi("fuerdich","Für dich")}${mi("merkliste","Merkliste",n?n+" offen":"")}${mi("verlauf","Verlauf")}${mi("suche","Suche")}
    <h3>Ressorts</h3>
    ${mi("start","Startseite")}${mi("neu","Neueste Artikel")}
    ${SECTIONS.map(([k,l])=>mi(k,l,cnt(k)?cnt(k)+" ungelesen":"")).join("")}
    ${mi("kolumnen","Kolumnen")}${mi("video","Video &amp; Podcast")}${mi("heft","Das Heft")}${mi("empfehlungen","Auswahl der Redaktion")}
    <h3>Einstellungen</h3>
    ${mi("sicherung","Merkliste sichern")}
    <div class="info">${articles.length} Artikel${upd?` · aktualisiert ${upd}`:""}<br>Artikel öffnen sich auf <a href="${BASE}" target="_blank" rel="noopener">surplusmagazin.de</a> – dort einmal einloggen, dann ist alles frei lesbar.</div>`;
}

function render(){
  const v=view();
  document.title=(v==="start"?"":(VIEWS[v]||"")+" · ")+"Surplus Reader";
  let h="";
  if(loadError) h+=`<div class="notice">Die Artikel konnten nicht geladen werden. Prüfe deine Internetverbindung.</div>`;
  if(!loaded && !loadError) h+=`<div class="skel" style="width:100%;height:190px;margin-top:18px;border-radius:12px"></div><div class="skel" style="width:40%"></div><div class="skel" style="width:90%;height:28px"></div><div class="skel"></div>`;
  else if(v==="start") h+=renderStart();
  else if(v==="fuerdich") h+=renderFuerDich();
  else if(v==="neu") h+=renderListView("Neueste Artikel","Alles von Surplus, neueste zuerst.",articles);
  else if(SECLABEL[v]) h+=renderListView(SECLABEL[v],"",articles.filter(a=>(a.s||[]).includes(v)));
  else if(v==="empfehlungen") h+=renderListView("Auswahl der Redaktion","Empfehlungen von Surplus.",articles.filter(a=>a.r));
  else if(v==="kolumnen") h+=renderKolumnen();
  else if(v==="video") h+=renderListView("Video &amp; Podcast","Gespräche mit Adam Tooze und mehr.",articles.filter(a=>a.k==="podcast"));
  else if(v==="heft") h+= issueView ? renderIssue(issueView) : renderHeft();
  else if(v==="merkliste") h+=renderMerkliste();
  else if(v==="verlauf") h+=renderVerlauf();
  else if(v==="suche") h+=renderSuche();
  else if(v==="sicherung") h+=renderSicherung();
  const keep = v==="suche" && document.activeElement && document.activeElement.id==="q";
  const pos = keep ? document.activeElement.selectionStart : 0;
  $("#main").innerHTML=h;
  renderChips(v); renderTabs(v); renderDrawer(v);
  if(v==="suche"){ const q=$("#q"); if(q){ q.addEventListener("input",e=>{ query=e.target.value; shown=PAGE; render(); }); if(keep||!query){ q.focus(); try{q.setSelectionRange(pos,pos);}catch(_){} } } }
}
let issueView = null;

// ---------- Aktionen ----------
function patch(id,p){ mine[id]={...st(id),...p}; saveState(); render(); }
function toggleSave(id){ const s=!isSaved(id); patch(id,{saved:s,savedAt:s?Date.now():null}); toast(s?"Auf die Merkliste gesetzt":"Von der Merkliste entfernt"); }
function toggleDone(id){ const r=!isRead(id); patch(id,{read:r,readAt:r?Date.now():null}); toast(r?"Als gelesen markiert":"Als ungelesen markiert"); }
function opened(id){ const now=Date.now(); patch(id,{read:true,readAt:st(id).readAt||now,openedAt:now}); }

document.addEventListener("click", e=>{
  const t=e.target.closest("[data-go],[data-save],[data-done],[data-open],[data-filter],[data-close],[data-clear],[data-more],[data-issue],[data-backup]");
  if(!t) return;
  const d=t.dataset;
  if(d.go){ e.preventDefault(); issueView=null; go(d.go); }
  else if(d.save){ e.preventDefault(); toggleSave(d.save); }
  else if(d.done){ e.preventDefault(); toggleDone(d.done); }
  else if(d.open){ const id=d.open; setTimeout(()=>opened(id),0); }
  else if(d.filter){ onlyUnread=d.filter==="1"; shown=PAGE; render(); }
  else if(d.close){ closeMenu(); }
  else if(d.more){ shown+=PAGE*2; render(); }
  else if(d.issue){ issueView=d.issue; render(); window.scrollTo(0,0); }
  else if(d.clear){ for(const a of articles) if(isSaved(a.id)&&isRead(a.id)) mine[a.id]={...st(a.id),saved:false,savedAt:null}; saveState(); render(); toast("Gelesene entfernt"); }
  else if(d.backup==="copy"){ const txt=JSON.stringify(mine); (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Sicherung kopiert"),()=>{ $("#bk").value=txt; $("#bk").select(); toast("Text markiert – bitte kopieren"); }); }
  else if(d.backup==="restore"){ try{ const o=JSON.parse($("#bk").value); if(!o||typeof o!=="object") throw 0; mine={...mine,...o}; saveState(); render(); toast("Sicherung eingespielt"); }catch(_){ toast("Das ist keine gültige Sicherung"); } }
});
document.addEventListener("error", e=>{ const el=e.target; if(el.tagName==="IMG"){ const o=el.dataset.orig; if(o && el.src!==o){ el.src=o; } else { el.remove(); } } }, true);
function openMenu(){ document.body.classList.add("menu"); }
function closeMenu(){ document.body.classList.remove("menu"); }
$("#btnMenu").addEventListener("click",openMenu);
$("#scrim").addEventListener("click",closeMenu);
$("#btnHome").addEventListener("click",()=>{ issueView=null; go("start"); });
$("#btnSearch").addEventListener("click",()=>go("suche"));
window.addEventListener("hashchange",()=>{ shown=PAGE; issueView=null; render(); window.scrollTo(0,0); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeMenu(); });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ mine=loadState(); if(Date.now()-lastLoad>10*60e3) loadData(); else render(); } });
window.addEventListener("storage",e=>{ if(e.key===STORE_KEY){ mine=loadState(); render(); } });

render();
loadData();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
})();
</script>
</body>
</html>
